name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate debug keystore
      run: |
        keytool -genkeypair \
          -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Debug APK (use wrapper if present, otherwise install Gradle)
      run: |
        set -e
        if [ -f "./gradlew" ]; then
          echo "Found gradlew, using Gradle wrapper"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "No gradlew found — installing Gradle 9.1.1 and running build"
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://services.gradle.org/distributions/gradle-9.1.1-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /tmp
          /tmp/gradle-9.1.1/bin/gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
